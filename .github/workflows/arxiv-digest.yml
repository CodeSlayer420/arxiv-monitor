name: arXiv Daily Digest

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 IST (UTC+5:30)
  workflow_dispatch:       # lets you trigger manually from the Actions tab

permissions:
  contents: write          # needed to commit the digest back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Set date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Run arXiv monitor
        run: python3 arxiv_monitor.py --no-open

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arxiv_digest_*.html professors_list.md professors_list.json
          git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push

      - name: Email digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: pranavcharith@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "arXiv Digest — ${{ env.DATE }}"
          to: pranavcharith@gmail.com
          from: "arXiv Monitor <pranavcharith@gmail.com>"
          html_body: file://arxiv_digest_${{ env.DATE }}.html
